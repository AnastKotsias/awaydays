# Local development database.
#
#   docker compose up -d      start PostgreSQL in the background
#   docker compose logs -f db  watch its logs
#   docker compose down        stop it (data is kept in the named volume)
#   docker compose down -v     stop it AND wipe all data
#
# Port 5433 is used on purpose so this never clashes with a PostgreSQL
# instance already installed on the host (which uses the default 5432).

services:
  db:
    image: postgres:16-alpine
    container_name: awaydays-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: awaydays
      POSTGRES_PASSWORD: awaydays
      POSTGRES_DB: awaydays
    ports:
      - "5433:5432"
    volumes:
      - awaydays-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awaydays -d awaydays"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  awaydays-db-data:
